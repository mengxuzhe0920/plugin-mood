<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小窝心情 · 今天你心里是什么天气</title>
<style>
  :root{
    --ink:#3a3a36; --ink-soft:#6b6b66; --line:#ececec; --card:#ffffff;
    --bg:#faf9f6; --accent:#e8a87c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink); background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}

  /* 顶栏 */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;max-width:760px;margin:0 auto;
  }
  .brand{font-weight:600;letter-spacing:1px;font-size:15px;}
  .brand .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle;}
  .topbar .links{font-size:13px;color:var(--ink-soft);}
  .topbar .links a{margin-left:14px;}
  .topbar .links a:hover{color:var(--ink);}

  .wrap{max-width:760px;margin:0 auto;padding:0 20px 60px;}

  /* 天空场景 */
  .sky{
    position:relative;height:240px;border-radius:20px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.06);transition:background .8s ease;
    background:linear-gradient(180deg,#fff7e6,#ffe9c2);
  }
  /* 天空顶部柔光，增加层次（不挡交互） */
  .sky::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(130% 90% at 50% 4%,rgba(255,255,255,.18),transparent 55%);}
  /* 彩虹场景下，大 emoji 缩小放进拱门里 */
  .sky.rainbow .big-emoji{top:auto;bottom:34px;transform:translate(-50%,0);font-size:42px;opacity:.95;}
  .sky .caption{
    position:absolute;left:0;right:0;bottom:16px;text-align:center;
    font-size:14px;color:rgba(58,58,54,.7);padding:0 16px;
  }
  .sky .big-emoji{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);
    font-size:64px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.12));
    transition:opacity .5s ease;
  }

  /* 太阳 */
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes sunpulse{0%,100%{box-shadow:0 0 28px 8px rgba(255,193,77,.50),0 0 60px 18px rgba(255,193,77,.20);}
    50%{box-shadow:0 0 38px 13px rgba(255,193,77,.64),0 0 86px 28px rgba(255,193,77,.30);}}
  .sun{position:absolute;top:38px;left:50%;transform:translateX(-50%);width:74px;height:74px;border-radius:50%;
    background:radial-gradient(circle at 38% 34%,#fff9e0 0%,#ffd860 58%,#ffb43c 100%);
    box-shadow:0 0 26px 8px rgba(255,193,77,.45),0 0 64px 22px rgba(255,193,77,.18);
    animation:sunpulse 4s ease-in-out infinite;}
  /* 8 道柔和光芒：细扇条 + 轻微模糊，避免灯泡感 */
  .sun::before{content:"";position:absolute;inset:-34px;border-radius:50%;
    background:repeating-conic-gradient(from 6deg,rgba(255,190,70,.6) 0deg 5deg,transparent 5deg 45deg);
    -webkit-mask:radial-gradient(circle,transparent 60%,#000 62% 90%,transparent 92%);
            mask:radial-gradient(circle,transparent 60%,#000 62% 90%,transparent 92%);
    filter:blur(1.2px);
    animation:spin 46s linear infinite;}
  /* 晴天由 CSS 太阳出镜，隐藏大 emoji 避免叠出锯齿 */
  .sky.sunny .big-emoji{display:none;}

  /* 云 */
  .cloud{position:absolute;border-radius:50px;opacity:.96;
    background:linear-gradient(180deg,#ffffff 0%,#eef2f8 100%);
    box-shadow:0 8px 18px rgba(90,110,140,.12);}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#ffffff;border-radius:50%;}
  .cloud.c1{width:110px;height:34px;top:60px;animation:drift 26s linear infinite;}
  .cloud.c1::before{width:46px;height:46px;top:-20px;left:18px;}
  .cloud.c1::after{width:34px;height:34px;top:-12px;left:58px;}
  .cloud.c2{width:80px;height:26px;top:120px;animation:drift 34s linear infinite reverse;}
  .cloud.c2::before{width:34px;height:34px;top:-16px;left:14px;}
  .cloud.c2::after{width:26px;height:26px;top:-10px;left:44px;}
  @keyframes drift{0%{left:-120px;}100%{left:110%;}}

  /* 雨 */
  .rain-drop{position:absolute;top:-12%;width:2px;height:14px;border-radius:2px;
    background:linear-gradient(transparent,rgba(120,150,190,.85));animation:fall linear infinite;}
  @keyframes fall{0%{transform:translateY(-20px);}100%{transform:translateY(300px);}}

  /* 闪电 */
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
  .flash.go{animation:flash 2.6s ease-in-out infinite;}
  @keyframes flash{0%,92%,100%{opacity:0;}94%{opacity:.55;}96%{opacity:.1;}98%{opacity:.4;}}

  /* 彩虹弧（类名用 rainbow-arc，避免与天空的 .sky.rainbow 修饰类冲突）
     拱形：半圆完全含在天空内，圆心在底边中点，六色环带向外渐变 */
  .rainbow-arc{position:absolute;left:50%;bottom:-6px;width:360px;height:180px;transform:translateX(-50%);
    opacity:.92;pointer-events:none;
    background:radial-gradient(circle at 50% 100%,
      transparent 0 82px,
      #ff5f6d 83px 95px,
      #ff9a3c 96px 108px,
      #ffe14d 109px 121px,
      #6fcf57 122px 134px,
      #4aa3df 135px 147px,
      #9b6bd6 148px 160px,
      transparent 161px);}

  /* 雪 */
  .snowflake{position:absolute;top:-10px;color:#fff;font-size:14px;opacity:.9;animation:fall-snow linear infinite;}
  @keyframes fall-snow{0%{transform:translateY(-10px) translateX(0);}100%{transform:translateY(260px) translateX(20px);}}

  /* 星空 */
  .star-dot{position:absolute;background:#fff;border-radius:50%;animation:twinkle ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.25;}50%{opacity:1;}}
  .moon{position:absolute;top:34px;right:46px;width:54px;height:54px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff,#cfd4e8);box-shadow:0 0 26px 6px rgba(207,212,232,.5);}
  .night .moon{display:block;} .moon{display:none;}

  /* 天气天空主题 */
  .sky.sunny{background:linear-gradient(180deg,#fff7e6,#ffe2a8);}
  .sky.cloudy{background:linear-gradient(180deg,#eef2f6,#dde6ee);}
  .sky.rain{background:linear-gradient(180deg,#9fb3c8,#7d93ad);}
  .sky.thunder{background:linear-gradient(180deg,#5b6478,#3f4658);}
  .sky.rainbow{background:linear-gradient(180deg,#eaf3ff,#d7e9ff);}
  .sky.snow{background:linear-gradient(180deg,#f4f8ff,#dde9f5);}
  .sky.star{background:linear-gradient(180deg,#1f2147,#2c2f5e);}

  /* 选择器 */
  .prompt{text-align:center;margin:22px 0 14px;font-size:16px;color:var(--ink-soft);}
  .picker{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
  .mood{
    border:1px solid var(--line);background:var(--card);border-radius:14px;
    padding:14px 6px 10px;text-align:center;cursor:pointer;transition:all .18s ease;
  }
  .mood:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.07);}
  .mood .e{font-size:26px;}
  .mood .l{font-size:13px;margin-top:4px;color:var(--ink);}
  .mood .p{font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.3;min-height:28px;}
  .mood.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,168,124,.18);background:#fffaf4;}

  .note{width:100%;margin-top:16px;border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;font:inherit;font-size:14px;resize:vertical;min-height:64px;background:var(--card);color:var(--ink);}
  .note:focus{outline:none;border-color:var(--accent);}
  .note-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .counter{font-size:12px;color:var(--ink-soft);}
  .btn{margin-top:14px;width:100%;border:none;border-radius:14px;padding:13px;font:inherit;font-size:15px;
    font-weight:600;color:#fff;background:var(--accent);cursor:pointer;transition:filter .15s ease;}
  .btn:hover{filter:brightness(1.04);}
  .btn:active{transform:scale(.99);}
  .status{text-align:center;margin-top:12px;font-size:13px;color:var(--ink-soft);min-height:18px;}

  .section{margin-top:34px;}
  .section h2{font-size:15px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .section h2 .badge{font-size:12px;font-weight:400;color:var(--ink-soft);}

  /* 云图 */
  .cloud-summary{font-size:14px;color:var(--ink-soft);margin-bottom:14px;line-height:1.6;}
  .cloud-pills{display:flex;flex-wrap:wrap;gap:10px;}
  .pill{border-radius:999px;padding:8px 14px;font-size:13px;display:flex;align-items:center;gap:7px;
    background:#fff;border:1px solid var(--line);}
  .pill .e{font-size:16px;}
  .pill .c{color:var(--ink-soft);}
  .notes{margin-top:16px;display:grid;gap:10px;}
  .qcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--ink);}
  .qcard .qe{margin-right:8px;}
  .qcard .qt{color:var(--ink-soft);font-size:12px;margin-left:6px;}

  /* 日历 */
  .streak{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:7px 14px;font-size:13px;margin-bottom:14px;}
  .streak b{font-size:16px;color:var(--accent);}
  .cal{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;}
  .day{aspect-ratio:1;border-radius:8px;background:#f0efea;position:relative;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .day .de{opacity:.9;}
  .day:hover .tip{display:block;}
  .tip{display:none;position:absolute;bottom:120%;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:11px;padding:6px 9px;border-radius:8px;white-space:nowrap;z-index:5;}
  .tip .tn{max-width:180px;white-space:normal;display:block;margin-top:2px;color:#eee;}
  .recent{margin-top:16px;display:grid;gap:8px;}
  .ritem{font-size:13px;color:var(--ink-soft);}
  .ritem .re{margin-right:6px;}
  .ritem .rd{color:#bbb;margin-right:6px;}
  .empty{color:var(--ink-soft);font-size:13px;}

  @media (max-width:560px){
    .picker{grid-template-columns:repeat(4,1fr);}
    .cal{grid-template-columns:repeat(10,1fr);}
    .sky{height:200px;}
  }
  @media (prefers-reduced-motion:reduce){
    .sun::before,.cloud,.rain-drop,.snowflake,.star-dot,.flash.go{animation:none!important;}
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span>小窝心情</div>
    <div class="links">
      <span id="ident" style="margin-right:6px;"></span>
      <a href="/">回主页</a><a href="/uc">个人中心</a>
    </div>
  </div>

  <div class="wrap">
    <div class="sky sunny" id="sky">
      <div class="big-emoji" id="bigEmoji">☀️</div>
      <div class="caption" id="skyCaption">轻盈，像晒到太阳的被子</div>
    </div>

    <div class="prompt">今天，你心里是什么天气？</div>

    <div class="picker" id="picker"></div>

    <textarea class="note" id="note" maxlength="140" placeholder="写一句今天的心情…（可不填）"></textarea>
    <div class="note-row">
      <span class="counter"><span id="cnt">0</span>/140</span>
      <span class="counter" id="loginHint"></span>
    </div>
    <button class="btn" id="record">记录今天</button>
    <div class="status" id="status"></div>

    <div class="section">
      <h2>今日心情云图 <span class="badge" id="cloudCount"></span></h2>
      <div class="cloud-summary" id="cloudSummary">正在看看大家今天的心情…</div>
      <div class="cloud-pills" id="cloudPills"></div>
      <div class="notes" id="cloudNotes"></div>
    </div>

    <div class="section">
      <h2>我的心情日历</h2>
      <div class="streak" id="streak">连续打卡 <b>0</b> 天</div>
      <div class="cal" id="cal"></div>
      <div class="recent" id="recent"></div>
    </div>
  </div>

<script>
const WEATHER = {
  sunny:   {emoji:'☀️', label:'晴',   poem:'轻盈，像晒到太阳的被子', color:'#ffd97a'},
  cloudy:  {emoji:'⛅', label:'多云', poem:'平淡，刚刚好的一天',     color:'#c9d2dc'},
  rain:    {emoji:'🌧️', label:'小雨', poem:'有点低落，想被温柔以待', color:'#8fb3d9'},
  thunder: {emoji:'⛈️', label:'雷阵雨',poem:'烦躁，等这场雨过去',     color:'#6b7390'},
  rainbow: {emoji:'🌈', label:'彩虹', poem:'感恩，阴霾后见了光',     color:'#f4a6c0'},
  snow:    {emoji:'❄️', label:'雪',   poem:'安静，想一个人待着',     color:'#cfe0f2'},
  star:    {emoji:'🌌', label:'星空', poem:'夜深了，还有些期待',     color:'#9aa0c4'},
};
const ORDER = ['sunny','cloudy','rain','thunder','rainbow','snow','star'];

let UID = null;
let selected = null;
let loggedToday = null; // {weather, note}

function api(p, opt){ return fetch('/mood/api'+p, opt||{}).then(r=>r.json()).catch(()=>({ok:false})); }

// 身份
async function initIdentity(){
  const r = await api('/me');
  const ident = document.getElementById('ident');
  if(r.ok && r.logged_in){
    UID = r.user.name;
    ident.textContent = '已登录 · ' + (r.user.displayName||r.user.name);
    document.getElementById('loginHint').textContent = '心情会跟随你的账号';
  }else{
    UID = localStorage.getItem('mood_uid');
    if(!UID){ UID = 'anon_' + Math.random().toString(36).slice(2,12); localStorage.setItem('mood_uid', UID); }
    ident.textContent = '本机访客';
    document.getElementById('loginHint').textContent = '登录后心情可跨设备';
  }
}

// 渲染选择器
function renderPicker(){
  const box = document.getElementById('picker');
  box.innerHTML = ORDER.map(k=>{
    const w = WEATHER[k];
    return `<div class="mood" data-k="${k}">
      <div class="e">${w.emoji}</div><div class="l">${w.label}</div>
      <div class="p">${w.poem}</div></div>`;
  }).join('');
  box.querySelectorAll('.mood').forEach(el=>{
    el.onclick = ()=> selectWeather(el.dataset.k);
  });
}

function selectWeather(k){
  selected = k;
  document.querySelectorAll('.mood').forEach(el=>el.classList.toggle('sel', el.dataset.k===k));
  const w = WEATHER[k];
  const sky = document.getElementById('sky');
  sky.className = 'sky ' + k + (k==='star'?' night':'');
  document.getElementById('bigEmoji').textContent = w.emoji;
  document.getElementById('skyCaption').textContent = w.poem;
  buildSky(k);
}

// 天空粒子（雨/雪/星）
function buildSky(k){
  const sky = document.getElementById('sky');
  sky.querySelectorAll('.sun,.cloud,.rain-drop,.flash,.rainbow-arc,.snowflake,.star-dot,.moon').forEach(e=>e.remove());
  if(k==='sunny'){
    const s=document.createElement('div'); s.className='sun'; sky.appendChild(s);
  }else if(k==='cloudy'){
    sky.insertAdjacentHTML('beforeend','<div class="cloud c1"></div><div class="cloud c2"></div>');
  }else if(k==='rain'){
    let h=''; for(let i=0;i<40;i++){const l=Math.random()*100;const d=(Math.random()*1+0.6).toFixed(2);const delay=(Math.random()*2).toFixed(2);h+=`<div class="rain-drop" style="left:${l}%;animation-duration:${d}s;animation-delay:${delay}s"></div>`;} sky.insertAdjacentHTML('beforeend',h);
  }else if(k==='thunder'){
    let h='<div class="flash go"></div>'; for(let i=0;i<46;i++){const l=Math.random()*100;const d=(Math.random()*0.7+0.5).toFixed(2);const delay=(Math.random()*2).toFixed(2);h+=`<div class="rain-drop" style="left:${l}%;animation-duration:${d}s;animation-delay:${delay}s"></div>`;} sky.insertAdjacentHTML('beforeend',h);
  }else if(k==='rainbow'){
    sky.insertAdjacentHTML('beforeend','<div class="cloud c1" style="opacity:.8"></div><div class="cloud c2" style="opacity:.7"></div><div class="rainbow-arc"></div>');
  }else if(k==='snow'){
    let h=''; for(let i=0;i<36;i++){const l=Math.random()*100;const d=(Math.random()*3+3).toFixed(2);const delay=(Math.random()*4).toFixed(2);const sc=(Math.random()*0.8+0.6).toFixed(2);h+=`<div class="snowflake" style="left:${l}%;animation-duration:${d}s;animation-delay:${delay}s;transform:scale(${sc})">❄️</div>`;} sky.insertAdjacentHTML('beforeend',h);
  }else if(k==='star'){
    sky.insertAdjacentHTML('beforeend','<div class="moon"></div>');
    let h=''; for(let i=0;i<60;i++){const x=Math.random()*100;const y=Math.random()*70;const s=(Math.random()*2+1).toFixed(1);const dur=(Math.random()*2+1.5).toFixed(2);const delay=(Math.random()*3).toFixed(2);h+=`<div class="star-dot" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;animation-duration:${dur}s;animation-delay:${delay}s"></div>`;} sky.insertAdjacentHTML('beforeend',h);
  }
}

// 记录
document.getElementById('record').onclick = async ()=>{
  const status = document.getElementById('status');
  if(!selected){ status.textContent = '先选一种天气吧 ☁️'; return; }
  status.textContent = '记录中…';
  const r = await api('/log', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({uid:UID, weather:selected, note: document.getElementById('note').value.trim()})});
  if(r.ok){
    status.textContent = '已记下今天的心情 ' + WEATHER[selected].emoji;
    loggedToday = {weather:selected, note:document.getElementById('note').value.trim()};
    document.getElementById('record').textContent = '更新今天的心情';
    loadToday(); loadCalendar();
  }else{
    status.textContent = '记录失败了，稍后再试～';
  }
};

document.getElementById('note').addEventListener('input', e=>{
  document.getElementById('cnt').textContent = e.target.value.length;
});

// 今日云图
async function loadToday(){
  const r = await api('/today');
  const sum = document.getElementById('cloudSummary');
  const pills = document.getElementById('cloudPills');
  const notes = document.getElementById('cloudNotes');
  document.getElementById('cloudCount').textContent = '';
  if(!r.ok){ sum.textContent = '暂时看不到了，晚点再来～'; return; }
  const total = r.total||0;
  document.getElementById('cloudCount').textContent = '· ' + total + ' 份心情';
  if(total===0){ sum.textContent = '今天还没有人留下心情，来做第一个吧 🌱'; pills.innerHTML=''; notes.innerHTML=''; return; }
  const top = r.top; const topW = WEATHER[top];
  sum.innerHTML = `今天小窝里有 <b>${total}</b> 个人留下了心情，最多的是 <b>${topW.emoji} ${topW.label}</b>。`;
  pills.innerHTML = ORDER.filter(k=>r.distribution[k]>0).map(k=>{
    const c=r.distribution[k]; const p=Math.round(c/total*100);
    return `<div class="pill"><span class="e">${WEATHER[k].emoji}</span>${WEATHER[k].label}<span class="c">${c} · ${p}%</span></div>`;
  }).join('');
  notes.innerHTML = (r.notes||[]).map(n=>{
    const w=WEATHER[n.weather]; const t=new Date((n.ts||0)*1000);
    const hh=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    return `<div class="qcard"><span class="qe">${w.emoji}</span>「${escapeHtml(n.note)}」<span class="qt">${hh}</span></div>`;
  }).join('') || '<div class="empty">今天还没人写下一句话～</div>';
}

// 我的日历
async function loadCalendar(){
  const r = await api('/calendar?uid='+encodeURIComponent(UID));
  const cal = document.getElementById('cal');
  const streakEl = document.getElementById('streak');
  const recent = document.getElementById('recent');
  if(!r.ok){ cal.innerHTML=''; return; }
  streakEl.innerHTML = '连续打卡 <b>'+(r.streak||0)+'</b> 天';
  const days = r.days||[];
  const map = {}; days.forEach(d=>map[d.date]=d);
  // 最近 84 天
  const N=84; const cells=[];
  const today = new Date();
  for(let i=N-1;i>=0;i--){
    const dt=new Date(today); dt.setDate(today.getDate()-i);
    const key=dt.toISOString().slice(0,10);
    const d=map[key];
    if(d){
      const w=WEATHER[d.weather];
      const tip = d.note ? `<div class="tip">${key}<span class="tn">「${escapeHtml(d.note)}」</span></div>` : `<div class="tip">${key}</div>`;
      cells.push(`<div class="day" style="background:${w.color}"><span class="de">${w.emoji}</span>${tip}</div>`);
    }else{
      cells.push(`<div class="day"></div>`);
    }
  }
  cal.innerHTML = cells.join('');
  // 最近心情列表
  const last = days.slice(-6).reverse();
  recent.innerHTML = last.length ? last.map(d=>{
    const w=WEATHER[d.weather]; const note=d.note?('：'+escapeHtml(d.note)):'';
    return `<div class="ritem"><span class="rd">${d.date}</span><span class="re">${w.emoji}</span>${w.label}${note}</div>`;
  }).join('') : '<div class="empty">还没有记录过，从今天开始吧 ✍️</div>';
}

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

// 启动
(async function(){
  renderPicker();
  await initIdentity();
  // 若今天已记录，预选
  const r = await api('/calendar?uid='+encodeURIComponent(UID));
  if(r.ok){
    const t=new Date().toISOString().slice(0,10);
    const today=r.days&&r.days.find(d=>d.date===t);
    if(today){ loggedToday=today; selectWeather(today.weather); document.getElementById('note').value=today.note||''; document.getElementById('cnt').textContent=(today.note||'').length; document.getElementById('record').textContent='更新今天的心情'; }
    else { selectWeather('sunny'); }
  }else{ selectWeather('sunny'); }
  await loadToday();
  await loadCalendar();
})();
</script>
